<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор полива картофеля</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f6f3;
            padding: 20px;
        }
        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        select, input, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #e6ffe6;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Калькулятор полива картофеля</h2>

    <label>Стадия растения:</label>
    <select id="stage">
        <option value="1">Посадка</option>
        <option value="1.5">Рост</option>
        <option value="2">Цветение</option>
        <option value="1.2">Созревание</option>
    </select>

    <label>Тип почвы:</label>
    <select id="soil">
        <option value="1.5">Песчаная</option>
        <option value="1">Суглинистая</option>
        <option value="0.8">Глинистая</option>
    </select>

    <label>Площадь полива (м²):</label>
    <input type="number" id="area" placeholder="Например: 20">

    <label>Погода за последние 2 дня:</label>
    <select id="weather">
        <option value="1.3">Солнечно</option>
        <option value="1">Пасмурно</option>
        <option value="0.6">Были дожди</option>
    </select>

    <button onclick="calculate()">Рассчитать</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate() {
    let stage = parseFloat(document.getElementById("stage").value);
    let soil = parseFloat(document.getElementById("soil").value);
    let weather = parseFloat(document.getElementById("weather").value);
    let area = parseFloat(document.getElementById("area").value);

    if (isNaN(area) || area <= 0) {
        alert("Введите площадь!");
        return;
    }

    // базовая норма: 5 литров на 1 м²
    let base = 5;

    let water = base * stage * soil * weather * area;

    let advice = "";

    if (weather < 1) {
        advice = "Полив рекомендуется сократить, так как недавно были дожди.";
    } else if (soil > 1.3) {
        advice = "Почва песчаная, рекомендуется увеличить частоту поливов.";
    } else {
        advice = "Условия нормальные, полив рекомендуется в стандартном режиме.";
    }

    document.getElementById("result").innerHTML = 
        "<b>Рекомендуемый объём воды:</b> " + water.toFixed(1) + " литров<br><br>" +
        "<b>Рекомендация:</b> " + advice;
}
</script>

</body>
</html>
